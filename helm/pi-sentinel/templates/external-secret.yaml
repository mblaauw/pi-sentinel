{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "pi-sentinel.name" . }}-credentials
  labels:
    {{- include "pi-sentinel.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ required "externalSecret.storeName required" .Values.externalSecret.storeName }}
  target:
    name: {{ include "pi-sentinel.name" . }}-credentials
    creationPolicy: Owner
  data:
    {{- range $name, $value := .Values.externalSecret.keys }}
    - secretKey: {{ $name | quote }}
      remoteRef:
        key: {{ $value.key | quote }}
        property: {{ $value.property | quote }}
        {{- with $value.decodingStrategy }}
        decodingStrategy: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
