# Consumers supply their context, namespace, task and environment values.
# This template deliberately does not invent an account, cluster or credentials.
.sentinel-deploy:
  stage: deploy
  image: $SENTINEL_DEPLOY_IMAGE
  variables:
    TASK_DIR: tasks/refinement-review
    SENTINEL_ENVIRONMENT: tst
  script:
    - test -n "$KUBE_CONTEXT"
    - test -n "$KUBE_NAMESPACE"
    - test -n "$SENTINEL_RUNTIME_IMAGE"
    - test -n "$SENTINEL_VALUES_FILE"
    - 'case "$SENTINEL_RUNTIME_IMAGE" in *@sha256:*) ;; *) echo "SENTINEL_RUNTIME_IMAGE must contain an immutable digest" >&2; exit 1 ;; esac'
    - IMAGE_REPOSITORY=${SENTINEL_RUNTIME_IMAGE%@*}
    - IMAGE_DIGEST=${SENTINEL_RUNTIME_IMAGE#*@}
    - sentinel task validate "$TASK_DIR" --environment "$SENTINEL_ENVIRONMENT"
    - sentinel task package "$TASK_DIR" --environment "$SENTINEL_ENVIRONMENT" --out artifacts/task
    - kubectl --context "$KUBE_CONTEXT" --namespace "$KUBE_NAMESPACE" apply -f artifacts/task/task-configmap.yaml
    - helm upgrade --install "$CI_PROJECT_NAME-$SENTINEL_ENVIRONMENT" helm/sentinel-pi --kube-context "$KUBE_CONTEXT" --namespace "$KUBE_NAMESPACE" --values artifacts/task/task-values.yaml --values "$SENTINEL_VALUES_FILE" --set-string "image.repository=$IMAGE_REPOSITORY" --set-string "image.digest=$IMAGE_DIGEST" --wait --timeout 5m
  artifacts:
    paths: [artifacts/task/]
