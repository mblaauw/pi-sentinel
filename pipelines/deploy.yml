# Consumers supply their context, namespace, task and environment values.
# This template deliberately does not invent an account, cluster or credentials.
.pi-sentinel-deploy:
  stage: deploy
  image: $PI_SENTINEL_DEPLOY_IMAGE
  variables:
    TASK_DIR: tasks/refinement-review
    PI_SENTINEL_ENVIRONMENT: tst
  script:
    - test -n "$KUBE_CONTEXT"
    - test -n "$KUBE_NAMESPACE"
    - test -n "$PI_SENTINEL_RUNTIME_IMAGE"
    - test -n "$PI_SENTINEL_VALUES_FILE"
    - 'case "$PI_SENTINEL_RUNTIME_IMAGE" in *@sha256:*) ;; *) echo "PI_SENTINEL_RUNTIME_IMAGE must contain an immutable digest" >&2; exit 1 ;; esac'
    - IMAGE_REPOSITORY=${PI_SENTINEL_RUNTIME_IMAGE%@*}
    - IMAGE_DIGEST=${PI_SENTINEL_RUNTIME_IMAGE#*@}
    - pi-sentinel task validate "$TASK_DIR" --environment "$PI_SENTINEL_ENVIRONMENT"
    - pi-sentinel task package "$TASK_DIR" --environment "$PI_SENTINEL_ENVIRONMENT" --out artifacts/task
    - kubectl --context "$KUBE_CONTEXT" --namespace "$KUBE_NAMESPACE" apply -f artifacts/task/task-configmap.yaml
    - helm upgrade --install "$CI_PROJECT_NAME-$PI_SENTINEL_ENVIRONMENT" helm/pi-sentinel --kube-context "$KUBE_CONTEXT" --namespace "$KUBE_NAMESPACE" --values artifacts/task/task-values.yaml --values "$PI_SENTINEL_VALUES_FILE" --set-string "image.repository=$IMAGE_REPOSITORY" --set-string "image.digest=$IMAGE_DIGEST" --wait --timeout 5m
  artifacts:
    paths: [artifacts/task/]
