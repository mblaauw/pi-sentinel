build-image:
  stage: build
  image: docker:28.5.1-cli
  services: [docker:28.5.1-dind]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: '1'
  rules:
    - changes: [src/**/*, schemas/**/*, Dockerfile, package.json, package-lock.json, tsconfig.json]
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --pull --build-arg "NODE_IMAGE=$NODE_IMAGE" --tag "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHORT_SHA"
    - docker inspect --format '{{index .RepoDigests 0}}' "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHORT_SHA" > image-digest.txt
    - printf 'PI_SENTINEL_IMAGE=%s\n' "$(cat image-digest.txt)" > image.env
  artifacts:
    paths: [image-digest.txt]
    reports:
      dotenv: image.env

package-chart:
  stage: package
  image:
    name: $HELM_IMAGE
    entrypoint: ['']
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: manual
      allow_failure: true
  script:
    - helm package helm/pi-sentinel --destination artifacts/charts
  artifacts:
    paths: [artifacts/charts/]
