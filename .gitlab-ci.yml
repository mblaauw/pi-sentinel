stages: [pre-flight, build, package, deploy]

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

include:
  - local: pipelines/validate.yml
  - local: pipelines/build.yml
  - local: pipelines/deploy.yml

variables:
  GIT_DEPTH: '1'
  NODE_IMAGE: node:24.19.0-bookworm
  HELM_IMAGE: alpine/helm:3.19.0
